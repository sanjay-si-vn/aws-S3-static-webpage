```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS S3 Static Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #1e293b, #020617);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: float 8s infinite ease-in-out alternate;
    }

    .circle1 {
      width: 300px;
      height: 300px;
      background: #38bdf8;
      top: 10%;
      left: 15%;
    }

    .circle2 {
      width: 250px;
      height: 250px;
      background: #8b5cf6;
      bottom: 10%;
      right: 15%;
      animation-delay: 2s;
    }

    @keyframes float {
      from {
        transform: translateY(0px) translateX(0px);
      }
      to {
        transform: translateY(-30px) translateX(20px);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 700px;
      padding: 50px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.2rem;
      color: #cbd5e1;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    .primary {
      background: linear-gradient(90deg, #0ea5e9, #8b5cf6);
    }

    .secondary {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .tech-stack {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .tag {
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e2e8f0;
      font-size: 0.9rem;
    }

    @media(max-width:768px){
      h1 {
        font-size: 2.5rem;
      }

      .card {
        padding: 35px 25px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
  </div>

  <div class="card">
    <h1>Cloud Deployment</h1>

    <p>
      Successfully deployed a modern static website using
      AWS S3 Static Website Hosting.
      This project demonstrates cloud hosting,
      frontend deployment, and modern UI design principles.
    </p>

    <div class="buttons">
      <a href="#" class="btn primary">AWS S3 Project</a>
      <a href="#" class="btn secondary">DevOps Journey</a>
    </div>

    <div class="tech-stack">
      <div class="tag">AWS S3</div>
      <div class="tag">HTML</div>
      <div class="tag">CSS</div>
      <div class="tag">Cloud</div>
      <div class="tag">Static Hosting</div>
    </div>
  </div>

</body>
</html>
